<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}توصيل{% endblock %}</title>

  <!-- Topic 3: Static Files — تحميل ملف CSS المشترك -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- شريط التنقل — يظهر في كل الصفحات بسبب Template Inheritance -->
<nav>
  <span class="brand">🚚 نظام التوصيل</span>
  <a href="{% url 'order_list' %}">الطلبات</a>
  <a href="{% url 'product_list' %}">المنتجات</a>
  <a href="/api/" target="_blank">API</a>
  <a href="{% url 'admin:index' %}">الإدارة</a>

  <!-- Topic 7: عرض اسم المستخدم وزر الخروج -->
  {% if user.is_authenticated %}
    <span style="color:#bdc3c7; font-size:13px;">| أهلاً {{ user.username }}</span>
    <a href="{% url 'logout' %}">خروج</a>
  {% endif %}
</nav>

<div class="container">
  {% block content %}
  {% endblock %}
</div>

</body>
</html>
