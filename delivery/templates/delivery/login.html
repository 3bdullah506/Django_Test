<!DOCTYPE html>
<!-- Topic 7: Authentication — صفحة تسجيل الدخول -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="card" style="margin-top:80px;">
  <h1>🔐 تسجيل الدخول</h1>

  <!-- Django يوفر هذا النموذج جاهزاً تلقائياً -->
  <form method="POST">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}</label>
      {{ field }}
    {% endfor %}

    {% if form.errors %}
      <p style="color:red; font-size:13px;">اسم المستخدم أو كلمة المرور غير صحيحة</p>
    {% endif %}

    <div class="form-btns">
      <button type="submit" class="btn btn-blue">دخول</button>
    </div>
  </form>
</div>

</body>
</html>
